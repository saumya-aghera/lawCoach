# LawAIer - Cloud Build Configuration
# Mirrors way-back-home/solutions/level_2/cloudbuild.yaml pattern
#
# Prerequisites (run once):
#   chmod +x scripts/setup.sh && ./scripts/setup.sh
#
# Deploy:
#   source set_env.sh
#   gcloud builds submit --config cloudbuild.yaml .

substitutions:
  _REGION: us-central1
  _AR_REPO: lawaier
  _BACKEND_SERVICE: lawaier-backend
  _FRONTEND_SERVICE: lawaier-frontend

steps:
  # ============================================================
  # BACKEND — build, push, deploy
  # ============================================================

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_BACKEND_SERVICE}:${BUILD_ID}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_BACKEND_SERVICE}:latest
      - ./backend
    id: build-backend

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_BACKEND_SERVICE}
    id: push-backend
    waitFor: [build-backend]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_BACKEND_SERVICE}
      - --image
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_BACKEND_SERVICE}:${BUILD_ID}
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --service-account
      - lawaier-sa@${PROJECT_ID}.iam.gserviceaccount.com
      - --set-env-vars
      - GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=${_REGION},GOOGLE_GENAI_USE_VERTEXAI=true
      - --memory
      - 2Gi
      - --cpu
      - "2"
      - --min-instances
      - "0"
      - --max-instances
      - "10"
      - --timeout
      - 120s
    id: deploy-backend
    waitFor: [push-backend]

  # Capture backend URL for frontend build
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run services describe ${_BACKEND_SERVICE} \
          --region ${_REGION} \
          --format 'value(status.url)' > /workspace/backend_url.txt
        echo "Backend URL: $(cat /workspace/backend_url.txt)"
    id: get-backend-url
    waitFor: [deploy-backend]

  # ============================================================
  # FRONTEND — build (inject backend URL), push, deploy
  # ============================================================

  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        BACKEND_URL=$$(cat /workspace/backend_url.txt)
        echo "Building frontend with VITE_API_URL=$$BACKEND_URL"
        docker build \
          --build-arg VITE_API_URL=$$BACKEND_URL \
          -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_FRONTEND_SERVICE}:${BUILD_ID} \
          -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_FRONTEND_SERVICE}:latest \
          ./frontend
    id: build-frontend
    waitFor: [get-backend-url]

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_FRONTEND_SERVICE}
    id: push-frontend
    waitFor: [build-frontend]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_FRONTEND_SERVICE}
      - --image
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_FRONTEND_SERVICE}:${BUILD_ID}
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --memory
      - 512Mi
      - --cpu
      - "1"
      - --min-instances
      - "0"
      - --max-instances
      - "10"
      - --timeout
      - 60s
    id: deploy-frontend
    waitFor: [push-frontend]

  # Print final URLs
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        BACKEND_URL=$$(cat /workspace/backend_url.txt)
        FRONTEND_URL=$$(gcloud run services describe ${_FRONTEND_SERVICE} \
          --region ${_REGION} --format 'value(status.url)')
        echo "=================================================="
        echo "  LAWAIER DEPLOYED"
        echo "=================================================="
        echo "  Backend:  $$BACKEND_URL"
        echo "  Frontend: $$FRONTEND_URL"
        echo "=================================================="
    id: final-output
    waitFor: [deploy-frontend]

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1800s
